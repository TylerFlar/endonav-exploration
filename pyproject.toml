[project]
name = "endonav-exploration"
version = "0.1.0"
description = "Reactive kidney endoscope exploration system"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "scikit-learn>=1.8.0",
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=5.5.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
name = "pytorch-cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
